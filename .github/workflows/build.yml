name: Build & Deploy Web

on:
  push:
    branches: [claude/godot-monster-rampage-hsan0i, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Import assets
        run: godot --headless --import 2>&1 | tee import.log || true

      - name: Script smoke check
        run: |
          godot --headless -s res://tools/ci_check.gd 2>&1 | tee check.log
          grep -q "CI_SMOKE_OK" check.log
          ! grep -E "SCRIPT ERROR|Parse Error" check.log

      - name: Provide export templates
        # GitHub Actions overrides HOME to /github/home inside containers;
        # the godot-ci image ships the templates under /root.
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates"
          cp -r /root/.local/share/godot/export_templates/4.3.stable "$HOME/.local/share/godot/export_templates/"

      - name: Export web build
        run: |
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html 2>&1 | tee export.log
          test -f build/web/index.html
          test -f build/web/index.wasm

      - name: Upload build as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web

      - name: Publish to gh-pages branch
        # Serving Pages from the gh-pages branch avoids the Pages-site
        # creation API, which the workflow token isn't allowed to call.
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
          force_orphan: true
